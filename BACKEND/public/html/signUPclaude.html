
<!DOCTYPE html>
<html lang="en">
<head>
  <title>InventoryPro - Sign Up</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="../css/signup.css" rel="stylesheet">
  

</head>
<body>
  <!-- Header Section -->
  <header>
    <div class="header-container">
      <div class="logo">
        <i class="fas fa-box-open"></i>
        <h1>InventoryPro</h1>
      </div>
      <nav>
        <ul>
          <li><a href="./sample.html">Home</a></li>
          <li><a href="#">Features</a></li>
          <li><a href="#">About Us</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
  
  <!-- Sign Up Container -->
  <div class="signup-container">
    <div class="background-shapes">
      <div class="shape shape-left"></div>
      <div class="shape shape-right"></div>
    </div>
    
    <!-- Sign Up Form -->
    <form action="http://localhost:8080/sign-up" method="post" class="signup-form">
      <h2>Create Your Account</h2>
      <p>Join InventoryPro and optimize your inventory management</p>
      
      <div class="form-row">
        <div class="form-group">
          <label for="firstname">First Name</label>
          <input type="text" id="firstname" name="firstname" placeholder="Enter your first name" required>
        </div>
        
        <div class="form-group">
          <label for="lastname">Last Name</label>
          <input type="text" id="lastname" name="lastname" placeholder="Enter your last name" required>
        </div>
      </div>

      <div class="form-group">
        <label for="username">User-Name</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
      </div>
      
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
      
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone" placeholder="Enter your phone number" pattern="\d{10}" maxlength="10" oninput="this.value = this.value.replace(/\D/g, '')" required>
      </div>
      
      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" name="role" required>
          <option value="" disabled selected>Select your role</option>
          <option value="owner">Business Owner</option>
          <option value="manager">Inventory Manager</option>
          <option value="staff">Warehouse Staff</option>
          <option value="other">Other</option>
        </select>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a password" required>
          <div class="password-requirements">
            Must be at least 8 characters with numbers and special characters
          </div>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
          <div id="error-message" style="color: red; display: none;">Passwords do not match!</div>          
        </div>
      </div>
      
      <div class="agreement">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>. I understand InventoryPro may send me emails about updates and promotions.</label>
      </div>
      
      <button type="submit" class="signup-btn">Create Account</button>
      
      <div class="or-divider">
        <span>OR</span>
      </div>
      
      <div class="social-signup">
        <button type="button" class="social-btn google-btn">
          <i class="fab fa-google"></i> Sign up with Google
        </button>
        <button type="button" class="social-btn facebook-btn">
          <i class="fab fa-facebook-f"></i> Sign up with Facebook
        </button>
      </div>
      
      <div class="login-prompt">
        Already have an account? <a href="#">Log In</a>
      </div>
    </form>
  </div>
  
  <script>
    // Function to validate passwords match
    function validatePasswords() {
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const errorMessage = document.getElementById("error-message");
      
      if (password === confirmPassword) {
        errorMessage.style.display = "none";
        return true;
      } else {
        errorMessage.style.display = "block";
        return false;
      }
    }

    // Add event listener to the form for submission validation
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.querySelector('.signup-form');
      
      form.addEventListener('submit', function(event) {
        // Validate passwords match before submission
        if (!validatePasswords()) {
          event.preventDefault(); // Prevent form submission
        }
      });
      
      // Add blur event to confirm password field
      const confirmPasswordField = document.getElementById('confirmPassword');
      confirmPasswordField.addEventListener('blur', validatePasswords);
      
      // Add input event to both password fields for real-time validation
      const passwordField = document.getElementById('password');
      passwordField.addEventListener('input', function() {
        if (confirmPasswordField.value !== '') {
          validatePasswords();
        }
      });
      
      confirmPasswordField.addEventListener('input', validatePasswords);
    });
  </script>
</body>
</html>
